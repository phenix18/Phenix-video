# Phenix-video — © 2026 Phenix - kcw. Construit PhenixVideo.exe + archive Windows (exécuté par GitHub, gratuit).
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire le lanceur
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --console --name PhenixVideo windows/launcher.py
      - name: Assembler l'archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Phenix-video-windows | Out-Null
          Copy-Item dist/PhenixVideo.exe Phenix-video-windows/
          Copy-Item -Recurse scripts, references, docs Phenix-video-windows/
          Copy-Item requirements.txt, README.md, LICENSE, NOTICE.md, VERSION, CHANGELOG.md Phenix-video-windows/
          Compress-Archive -Path Phenix-video-windows -DestinationPath Phenix-video-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Phenix-video-windows
          path: Phenix-video-windows.zip
      - name: Publier dans les Releases (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Phenix-video-windows.zip
